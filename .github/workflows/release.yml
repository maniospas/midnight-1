name: Build + Snapshot Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: midnight-next-morn-linux
          - os: windows-latest
            platform: windows
            artifact_name: midnight-next-morn-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake git zip libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev
          git clone --depth 1 https://github.com/raysan5/raylib.git
          cd raylib
          cmake -S . -B build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          sudo cmake --install build
          sudo ldconfig

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-raylib
            zip

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build
          g++ main.cpp -O2 -flto -std=c++17 -o build/game -lraylib -lm -ldl -lpthread -lGL -lrt -lX11

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p build
          g++ main.cpp -O2 -flto -std=c++17 -o build/game.exe -lraylib -lopengl32 -lgdi32 -lwinmm

      - name: Bundle Windows DLLs
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          ldd build/game.exe | awk '{print $3}' | grep '^/ucrt64/bin/' | while read dll; do cp "$dll" build/; done

      - name: Copy assets
        shell: bash
        run: cp -r data build/

      - name: Create Linux zip
        if: matrix.platform == 'linux'
        run: cd build && zip -r ../${{ matrix.artifact_name }}.zip .

      - name: Create Windows zip
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: cd build && zip -r ../${{ matrix.artifact_name }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete snapshot release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete snapshot -y --cleanup-tag || true

      - name: Create snapshot release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: Snapshot Build
          prerelease: true
          files: |
            artifacts/midnight-next-morn-linux/midnight-next-morn-linux.zip
            artifacts/midnight-next-morn-windows/midnight-next-morn-windows.zip
